[package]
name = "glueball"
version = "0.1.0"
edition = "2024"
description = "Multiplayer Server for Synthesis"
license = "Apache-2.0"
repository = "https://github.com/Autodesk/synthesis"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
argh = "0.1.19"
bytes = "1.12.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
colored = "3.1.1"
crossterm = "0.28"
dashmap = "6.2.1"
directories = "6.0.0"
futures-channel = "0.3.33"
futures-util = "0.3.33"
rand = "0.10.2"
ratatui = "0.29"
rmp-serde = "1.3.1"
rtrb = "0.3.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
toml = "1.1.4"
ts-rs = "12.0.1"
uuid = { version = "1.24.0", features = ["v4"] }
wtransport = "0.7.1"

[lints.clippy]
suspicious    = { level = "deny", priority = -1 }
complexity    = { level = "deny", priority = -1 }
perf          = { level = "deny", priority = -1 }
style         = { level = "deny", priority = -1 }
pedantic      = { level = "deny", priority = -1 }
nursery       = { level = "deny", priority = -1 }

unwrap_used   = "deny"
expect_used = "deny"
