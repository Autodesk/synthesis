name: "Setup Fission Bun"
description: "Set up Bun and dependencies for Fission"
runs:
  using: composite
  steps:
    - name: Install Bun prerequisites
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if command -v unzip >/dev/null 2>&1; then
          exit 0
        fi

        if ! command -v apt-get >/dev/null 2>&1; then
          echo "Unable to install unzip: apt-get is unavailable" >&2
          exit 1
        fi

        if [ "$(id -u)" -eq 0 ]; then
          apt-get update
          apt-get install -y --no-install-recommends unzip
          rm -rf /var/lib/apt/lists/*
        else
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip
        fi

    - name: Bun Setup
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ env.BUN_VERSION }}

    - name: Cache Node Dependencies
      uses: actions/cache@v6
      with:
        key: "${{runner.os}}-npm-fission-${{hashFiles('fission/bun.lock')}}"
        path: "fission/node_modules"
        restore-keys: |
          ${{runner.os}}-npm-fission-
          ${{runner.os}}-npm

    - name: Install Dependencies
      shell: bash
      run: bun install --frozen-lockfile
      working-directory: "fission"
