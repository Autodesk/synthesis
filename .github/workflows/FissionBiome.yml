name: Fission - Biome Format and Lint Validation

on:
  workflow_dispatch: {}
  push:
    branches: [prod, dev]
  pull_request:
    branches: [prod, dev]

jobs:
  runBiomeValidationScript:
    name: Biome Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "fission"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Fission Bun
        uses: ./.github/actions/FissionSetup

      - name: Lint
        if: ${{ always() }}
        run: bun run lint --diagnostic-level=error

      - name: Format
        if: ${{ always() }}
        run: bun run fmt
