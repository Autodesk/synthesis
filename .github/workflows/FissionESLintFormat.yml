name: Fission - ES Lint Format Validation

on:
  workflow_dispatch: {}
  push: 
    branches: [ prod, dev ]
  pull_request:
    branches: [ prod, dev ]

jobs:
  runFormatValidationScript:
    name: ESLint Format Validation
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v2
    - name: JavaScript Setup
      uses: actions/setup-node@v2
      with:
        node-version: 20
    - name: Cache Node Dependencies
      uses: actions/cache@v3
      with:
        key: "${{runner.os}}-npm-fission-${{hashFiles('package.json')}}"
        path: 'fission/node_modules'
        restore-keys: |
          ${{runner.os}}-npm-fission-
          ${{runner.os}}-npm
    - name: Install Dependencies
      run: |
        cd fission
        npm install
    - name: Linter
      id: linter-validation
      if: ${{ always() }}
      run: |
        cd fission
        npm run lint && echo "ESLint Validation Passed" || (echo "ESLint Validation Failed" && exit 1)
    - name: Prettier
      id: prettier-validation
      if: ${{ always() }}
      run: |
        cd fission
        npx prettier --version
        npm run prettier && echo "Prettier Validation Passed" || (echo "Prettier Validation Failed" && exit 1)
