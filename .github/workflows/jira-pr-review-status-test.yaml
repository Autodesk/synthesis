# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Validate Jira pull request review status

on:
  pull_request:
    paths:
      - .github/workflows/jira-pr-review-event.yaml
      - .github/workflows/jira-pr-review-status-test.yaml
      - .github/workflows/jira-pr-review-status.yaml
      - .github/workflows/jira/**
  push:
    branches:
      - dev
      - prod
    paths:
      - .github/workflows/jira-pr-review-event.yaml
      - .github/workflows/jira-pr-review-status-test.yaml
      - .github/workflows/jira-pr-review-status.yaml
      - .github/workflows/jira/**

permissions:
  contents: read

jobs:
  test:
    name: Jira review status tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Test Jira review status synchronization
        run: bun test ./.github/workflows/jira/sync-pr-review-status.test.ts
