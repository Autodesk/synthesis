name: Glueball - Build
on:
  release:
    types:
      - created
  push:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read
  attestations: write

env:
  BIN_NAME: glueball

jobs:
  releaseBuildGlueball:
    name: Glueball Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        build: [ linux, macos, win-msvc ]
        include:
          - build: linux
            os: ubuntu-latest
            rust: stable
            target: x86_64-unknown-linux-gnu
          - build: linux
            os: ubuntu-latest
            rust: stable
            target: aarch64-unknown-linux-gnu
          - build: macos
            os: macos-latest
            rust: stable
            target: x86_64-apple-darwin
          - build: macos
            os: macos-latest
            rust: stable
            target: aarch64-apple-darwin
          - build: win-msvc
            os: windows-latest
            rust: stable
            target: x86_64-pc-windows-msvc
          - build: win-msvc
            os: windows-latest
            rust: stable
            target: aarch64-pc-windows-msvc

    defaults:
      run:
        working-directory: "glueball"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          targets: ${{ matrix.target }}
      - name: Build release binary
        shell: bash
        run: cargo build --release --target ${{ matrix.target }} --verbose

      - name: Build archive
        shell: bash
        run: |
          outdir="./target/${{ env.TARGET_DIR }}/release"
          staging="${{ env.BIN_NAME }}-${{ matrix.target }}"
          mkdir -p "$staging"
          cp -r ../docs/multiplayer/ "$staging/"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/${{ env.BIN_NAME }}.exe" "$staging/"
            cd "$staging"
            7z a "../$staging.zip" .
            echo "ASSET=$staging.zip" >> $GITHUB_ENV
          else
            cp "target/${{ matrix.target }}/release/${{ env.BIN_NAME }}" "$staging/"
            tar czf "$staging.tar.gz" -C "$staging" .
            echo "ASSET=$staging.tar.gz" >> $GITHUB_ENV
          fi
      

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: ./glueball/${{ env.ASSET }}

      - name: Upload Release Asset
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run:
          gh release upload ${{ github.event.release.tag_name }}  ${{ env.ASSET }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        if: github.ref_type != 'tag'
        with:
          name: ${{ matrix.target }}
          path: ./glueball/${{ env.ASSET }}
          archive: true


