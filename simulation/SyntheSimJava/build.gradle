plugins {
    // Apply the java-library plugin for API and implementation separation.
    id 'java-library'
    id 'maven-publish'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()

    // WPILib
    maven {
        url "https://frcmaven.wpi.edu/artifactory/release/"
    }

    // CTRE
    maven {
        url "https://maven.ctr-electronics.com/release/"
    }

    // REV
    maven {
        url "https://maven.revrobotics.com/"
    }

    // Studica (NavX)
    maven {
        url "https://dev.studica.com/maven/release/2026/"
    }
}

def WPI_Version = '2026.2.2'
def REV_Version = '2026.0.5'
def CTRE_Version = '26.3.0'
def STUDICA_Version = '2026.0.0'
// OpenCV is still published under the frc2025 group for the 2026 season (no frc2026 group).
def OPENCV_Group = 'edu.wpi.first.thirdparty.frc2025.opencv'
def OPENCV_Version = '4.10.0-3'

dependencies {
    // This dependency is exported to consumers, that is to say found on their compile classpath.
    api libs.commons.math3

    // This dependency is used internally, and not exposed to consumers on their own compile classpath.
    implementation libs.guava

    // WPILib
    implementation "edu.wpi.first.wpilibj:wpilibj-java:$WPI_Version"
    implementation "edu.wpi.first.wpiutil:wpiutil-java:$WPI_Version"
    implementation "edu.wpi.first.hal:hal-java:$WPI_Version"
    implementation "edu.wpi.first.wpimath:wpimath-java:$WPI_Version"
    implementation "edu.wpi.first.ntcore:ntcore-java:$WPI_Version"
    implementation "edu.wpi.first.wpiunits:wpiunits-java:$WPI_Version"

    // cscore + OpenCV, for the simulated USB camera (CameraServer-compatible) support.
    implementation "edu.wpi.first.cscore:cscore-java:$WPI_Version"
    implementation "$OPENCV_Group:opencv-java:$OPENCV_Version"

    // WebSocket server used to receive rendered camera frames from Synthesis. Frames are
    // too large for the HALSim SimDevice channel, so they stream over a side channel.
    implementation "org.java-websocket:Java-WebSocket:1.5.7"

    // REVRobotics
    implementation "com.revrobotics.frc:REVLib-java:$REV_Version"

    // CTRE
    implementation "com.ctre.phoenix6:wpiapi-java:$CTRE_Version"

    // Studica (NavX)
    implementation "com.studica.frc:Studica-java:$STUDICA_Version"
}

java {
    withJavadocJar()
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

publishing() {
    publications {
        maven(MavenPublication) {
            group = 'com.autodesk.synthesis'
            artifactId = 'SyntheSimJava'
            version = '1.0.0'

            from components.java
        }
    }
}
